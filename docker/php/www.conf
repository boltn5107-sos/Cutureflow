; Pool PHP-FPM — remplace la configuration par défaut de l'image.
[www]

user = www-data
group = www-data

listen = 127.0.0.1:9000

; Les instances Render Starter ont 0,5 vCPU : on reste volontairement
; modeste pour éviter que la saturation du CPU se traduise par des
; timeouts en amont du proxy.
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
; Recycling régulier : évite qu'une fuite mémoire lente s'accumule.
pm.max_requests = 500

; CRUCIAL — Render injecte les variables d'environnement du service
; (APP_KEY, identifiants de base de données, PERSISTENT_STORAGE_PATH) dans
; le processus conteneur. PHP-FPM les efface par défaut pour ses workers :
; sans ce réglage, l'application démarrerait sans clé d'application ni
; accès à la base, et renverrait 500 sur toutes les pages.
clear_env = no

; Les erreurs des workers doivent apparaître dans les journaux Render.
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr
