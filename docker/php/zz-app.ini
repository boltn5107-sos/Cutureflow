; Réglages applicatifs — surcharge les valeurs par défaut de l'image PHP.
; Fichier chargé après le php.ini de l'image (préfixe « zz- »).

; ---------------------------------------------------------------- sécurité
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ---------------------------------------------------------------- requêtes
; PAYMENT_PROOF_MAX_KB et MEDIA_MAX_KB valent 4096 Ko par défaut.
upload_max_filesize = 12M
post_max_size = 16M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 60
default_charset = "UTF-8"

date.timezone = UTC

; ---------------------------------------------------------------- opcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Le code ne change jamais dans le conteneur : inutile de revalider les
; horodatages à chaque requête.
opcache.validate_timestamps = 0
opcache.save_comments = 1

; ---------------------------------------------------------------- cache réel
realpath_cache_size = 4096k
realpath_cache_ttl = 600
