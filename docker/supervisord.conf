; Supervisord — démarre Nginx et PHP-FPM dans le même conteneur.
;
; Render ne fournit qu'un seul processus par service : c'est ce superviseur
; qui fait tourner les deux.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

[program:php-fpm]
; Le master doit rester root pour pouvoir basculer les workers sur
; www-data ; c'est le pool qui fixe l'utilisateur des workers.
command = php-fpm --nodaemonize
autostart = true
autorestart = true
priority = 10
startsecs = 5
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
autostart = true
autorestart = true
priority = 20
startsecs = 5
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
