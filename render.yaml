# ==========================================================================
#  Couture Flow — Render Blueprint
# ==========================================================================
#  Création du service depuis l'interface Render :
#    Blueprints > New Blueprint Instance > pointed sur ce dépôt
#
#  Ou directement depuis le tableau de bord Render :
#    New > Web Service > connecter le dépôt (le Dockerfile est détecté seul)
#
#  Les variables marquées « sync: false » sont à saisir dans le tableau de
#  bord : elles ne sont jamais inscrites dans le dépôt.
# ==========================================================================

services:
  - type: web
    name: coutureflow
    runtime: docker

    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Les disques persistants sont réservés aux plans payants.
    # 0.5c-512mb est l'ancien plan « Starter » : 7 $/mois.
    # Singapore : la région la plus proche du Sénégal.
    plan: 0.5c-512mb
    region: singapore

    # Route de santé Laravel (bootstrap/app.php). Si elle ne répond pas en
    # quelques secondes, Render considère le déploiement comme échoué.
    healthCheckPath: /up

    # Déploiement manuel : ce projet joue ses migrations au démarrage, mieux
    # vaut déclencher le déploiement après avoir relu le diff.
    autoDeployTrigger: 'off'

    # ------------------------------------------------------------- variables
    envVars:
      - key: APP_NAME
        value: "Couture Flow"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: APP_CURRENCY
        value: FCFA
      - key: APP_MAINTENANCE_DRIVER
        value: file

      # ---------------------------------------------------------------- base
      # Render fournit sa propre PostgreSQL, déclarée plus bas dans
      # « databases ». Le réseau privé de Render relie le service à la base
      # car les deux sont en région Singapore : la connexion ne quitte jamais
      # l'infrastructure de Render et n'a besoin d'aucun certificat.
      #
      # DB_URL est une URL unique (postgresql://user:password@host:port/base)
      # que Render maintient à jour. Laravel la décompose tout seul et ignore
      # DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME et DB_PASSWORD.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: coutureflow-db
          property: connectionString

      # ------------------------------------------------- sessions et caches
      # Base de données plutôt que fichier : le conteneur est éphémère.
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # ---------------------------------------------------------- fichiers
      # Les preuves Wave et les photos sont écrites sur le disque persistant
      # monté par l'entrypoint (voir docker/entrypoint.sh).
      - key: FILESYSTEM_DISK
        value: local
      - key: PAYMENT_PROOF_DISK
        value: local
      - key: MEDIA_DISK
        value: local
      - key: PERSISTENT_STORAGE_PATH
        value: /var/data
      - key: AUTO_MIGRATE
        value: "true"

      # -------------------------------------------------------------- logs
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      # -------------------------------------------------------------- e-mail
      # Aucune notification n'est expédiée par e-mail : tout passe par la
      # messagerie interne du site (canal « database »). Le service de
      # transport reste « log » — les éventuels messages ne quittent jamais
      # le serveur, ce qui évite toute fuite d'adresse.
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "Couture Flow"

      # ------------------------------------------------------------- Wave
      - key: WAVE_PAYMENT_NUMBER
        sync: false
      - key: WAVE_PAYMENT_NAME
        sync: false
      - key: WAVE_COUNTRY
        value: SN

      # -------------------------------------------------------- abonnement
      - key: SUBSCRIPTION_AMOUNT
        value: "2000"
      - key: SUBSCRIPTION_MONTHS
        value: "1"
      - key: SUBSCRIPTION_LABEL
        value: "Abonnement mensuel"
      - key: REMINDER_DUE_SOON_DAYS
        value: "2"

      # ------------------------------------------------- notifications push
      # Clés VAPID (Web Push). À générer une fois et à renseigner via le
      # panneau Render ; sans elles, aucune notification n'est poussée.
      - key: VAPID_SUBJECT
        value: "mailto:atelier@couture-flow.app"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

    # Preuves de paiement, photos clients et photos de modèles.
    # Sans ce disque, un redéploiement effacerait toutes les images.
    disk:
      name: coutureflow-media
      mountPath: /var/data
      sizeGB: 10

# ==========================================================================
#  Base de données
# ==========================================================================
#  PostgreSQL 17 en offre payante : 6 $/mois, 1 Go de stockage inclus.
#  Les photos et les reçus ne sont pas ici : ils vivent sur le disque du
#  service. La base ne contient que du texte, 1 Go suffit largement.
#
#  ipAllowList: [] interdit toute connexion depuis Internet : seule la
#  connexion privée de Render est acceptée. Personne, pas même un pirate,
#  ne peut donc se connecter à la base depuis l'extérieur. Pour un outil
#  externe (pgAdmin, DBeaver), il faudra rouvrir l'accès le temps de
#  l'opération, puis refermer.
# ==========================================================================
databases:
  - name: coutureflow-db
    region: singapore
    postgresMajorVersion: "17"
    plan: 0.1c-256mb
    databaseName: coutureflow
    user: coutureflow
    diskSizeGB: 1
    ipAllowList: []
